AWSTemplateFormatVersion: '2010-09-09'
Description: 'AURA M&A Intelligence Platform - Production Infrastructure (S3 + CloudFront + OAC)'

Parameters:
  BucketNamePrefix:
    Type: String
    Default: 'aura-mna-platform'
    Description: 'Prefix for the S3 bucket storing application assets'

Resources:
  # 1. Private S3 Bucket for Static Web App Hosting
  WebAppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # 2. CloudFront Origin Access Control (OAC) for secure S3 origin access
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketNamePrefix}-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 3. Global CloudFront CDN Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: 'AURA M&A Precision Target Discovery and Intelligence Platform'
        DefaultRootObject: index.html
        PriceClass: PriceClass_100 # Low-cost tier (US, Canada, Europe)
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebAppBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        # SPA Client-side Routing Fallback (Redirect 403/404 to index.html with HTTP 200)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # 4. S3 Bucket Policy: Authorize CloudFront OAC only
  WebAppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebAppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebAppBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

Outputs:
  S3BucketName:
    Description: 'Amazon S3 Bucket Name'
    Value: !Ref WebAppBucket
  CloudFrontDistributionId:
    Description: 'CloudFront Distribution ID (Use for cache invalidations)'
    Value: !Ref CloudFrontDistribution
  CloudFrontDomainName:
    Description: 'CloudFront Live HTTPS URL'
    Value: !GetAtt CloudFrontDistribution.DomainName
  LiveApplicationURL:
    Description: 'Direct Web Application URL'
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
